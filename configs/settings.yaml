seed: 20261112

data:
  provider: yfinance            # unofficial source, prototyping only
  start_date: 2010-01-01
  raw_dir: data/raw
  processed_dir: data/processed
  report_path: reports/data_quality.md
  request_pause_seconds: 1.0
  max_retries: 3

validation:
  # A close-to-close move larger than this with no split on the day is flagged.
  max_abs_daily_return: 0.25

# Bars removed in cleaning for a stated reason (DECISIONS.md Q-15). Raw data keeps them.
exclusions:
  - {symbol: IDR=X, date: 2010-11-01, reason: "decimal-shift bad tick (close is 1/10 of neighbours)"}
  - {symbol: IDR=X, date: 2012-02-07, reason: "decimal-shift bad tick (close is 1/10 of neighbours)"}

# Sessions whose close-to-close return is not trustworthy: Yahoo applies an unrecorded
# adjustment at these rights-issue ex-dates (DECISIONS.md 6.3, Q-17). Labels whose
# window crosses one are NaN. For features the day's return is one missing bar.
price_breaks:
  - {symbol: BBNI.JK, date: 2010-12-03, note: "rights issue, Dec 2010; date read from the data"}
  - {symbol: BMRI.JK, date: 2011-02-08, note: "rights issue, Feb 2011; date read from the data"}
  - {symbol: BBTN.JK, date: 2012-11-19, note: "rights issue I, ex-date per press (britama.com)"}
  - {symbol: BBRI.JK, date: 2021-09-08, note: "rights issue, ex-date per KSEI"}
  - {symbol: BBTN.JK, date: 2022-12-23, note: "rights issue II, ex-date per press"}

# Targets and features (blueprint sections 3 and 7). Fixed before any model results.
dataset:
  feature_set_version: v2
  annualisation_sessions: 252
  return_horizons: [5, 20, 60]
  volatility_horizons: [20, 60]
  dataset_dir: data/processed/dataset
  report_path: reports/dataset_summary.md

features:
  return_windows: [5, 20, 60, 120, 250]
  volatility_windows: [20, 60, 120]
  ma_windows: [50, 200]
  rsi_window: 14
  drawdown_window: 250
  relative_volume: {short: 20, long: 120}
  market_windows: [20, 60]     # index return and volatility
  fx_windows: [20, 60]         # USD/IDR change, Indonesian names only
  # Q-18: windows of min_window sessions or more may miss this share of bars in the
  # middle of the window (both ends must exist). Shorter windows and all labels are strict.
  long_window: {min_window: 120, max_missing_share: 0.02}

# Context series per market. Only `close` is read from a context series.
# fx_lag_business_days: a Yahoo FX bar dated D closes after the IDX close on D,
# so an IDX origin on D may only use the FX bar of the previous business day.
context:
  US: {index: ^GSPC}
  ID: {index: ^JKSE, fx: IDR=X, fx_lag_business_days: 1}

# Known corporate actions used to verify price-return semantics (blueprint 3.1).
# The provider's Close must be continuous across each of these dates.
split_checks:
  - {symbol: NVDA,    date: 2024-06-10, ratio: 10}
  - {symbol: BBCA.JK, date: 2021-10-13, ratio: 5}

# Target boundaries confirmed in Milestone 0 (docs/DECISIONS.md 2.1).
# Tests pin the calendar module to these dates.
targets:
  q1_2027:
    XNYS: {start: 2026-12-31, end: 2027-03-31, sessions: 60}
    XIDX: {start: 2026-12-30, end: 2027-03-31, sessions: 53}

calendars:
  # Official exchange holidays that the calendar library may not know about.
  # XIDX 2026: IDX announcement Peng-00171/BEI.POP/09-2025 (239 sessions).
  # XIDX 2027: IDX announcement Peng-00169/BEI.POP/09-2026 (241 sessions).
  # Dates were taken from press reports quoting the announcements; see DECISIONS.md.
  # XIDX 2022 and 2025 entries: sessions the library marks open on which no Indonesian
  # series has a bar; added on the user's approval (DECISIONS.md Q-14).
