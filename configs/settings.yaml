seed: 20261112

data:
  provider: yfinance            # unofficial source, prototyping only
  start_date: 2010-01-01
  raw_dir: data/raw
  processed_dir: data/processed
  report_path: reports/data_quality.md
  request_pause_seconds: 1.0
  max_retries: 3

validation:
  # A close-to-close move larger than this with no split on the day is flagged.
  max_abs_daily_return: 0.25

# Known corporate actions used to verify price-return semantics (blueprint 3.1).
# The provider's Close must be continuous across each of these dates.
split_checks:
  - {symbol: NVDA,    date: 2024-06-10, ratio: 10}
  - {symbol: BBCA.JK, date: 2021-10-13, ratio: 5}

# Target boundaries confirmed in Milestone 0 (docs/DECISIONS.md 2.1).
# Tests pin the calendar module to these dates.
targets:
  q1_2027:
    XNYS: {start: 2026-12-31, end: 2027-03-31, sessions: 60}
    XIDX: {start: 2026-12-30, end: 2027-03-31, sessions: 53}

calendars:
