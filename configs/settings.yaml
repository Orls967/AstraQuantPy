# Evaluation protocol (blueprint section 8). Fixed before any model was run;
# see DECISIONS.md section 8. Do not change after seeing results.
evaluation:
  first_test_year: 2016          # five labelled years (2011 to 2015) before the first test block
  inner_validation_years: 3      # hyperparameters: the last 3 years of each training window
  min_inner_train_rows: 30
  ridge:
    alphas: [0.1, 1.0, 10.0, 100.0, 1000.0, 10000.0]
  lightgbm:
    fixed:
      learning_rate: 0.05
      min_child_samples: 20
      colsample_bytree: 0.8
      reg_lambda: 1.0
    grid:
      num_leaves: [3, 7]
      n_estimators: [50, 150]
  interval:
    level: 0.80
    min_prior_test_years: 2      # residuals of at least 2 earlier test years
  output_dir: data/processed/evaluation
  report_dir: reports/evaluation

# Frozen forecast (blueprint 3.3 and section 9, Milestone 4; DECISIONS.md section 9).
forecast:
  quarter: 2027Q1
  target_key: q1_2027                   # pinned dates under `targets`
  target_type: q1_2027_price_return
  model_version: "1"
  ledger_path: data/ledger/astraquant.sqlite
  export_path: reports/forecast_ledger.csv
  report_path: reports/q1_2027.md
  dry_run_dir: data/dry_run
