[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "astraquant"
version = "0.1.0"
description = "Local research project: frozen Q1 2027 price-return forecasts with prediction intervals."
requires-python = ">=3.12,<3.13"
# Exact pins, resolved 2026-11-12 for macOS arm64 / Python 3.12.
# Add a dependency only when a milestone needs it (see docs/DECISIONS.md).
dependencies = [
    "pandas==3.1.1",
    "numpy==2.5.4",
    "pyarrow==26.0.1",
    "yfinance==1.8.0",
    "exchange-calendars==4.13.2",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D2", "D4"]
ignore = ["D203", "D213", "D401", "D413"]
